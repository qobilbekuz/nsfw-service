# api.qobilbek.dev.conf ichiga qo'shiladigan blok.
# `stars/` bloki bilan bir xil uslubda.
#
# `^~` MAJBURIY: usiz `/nsfw/...` yo'llari vhost'dagi regex location'larga
# (`\.(jpg|png)$`, `\.html$`, deny_sensitive.conf dagi `\.py$` va h.k.)
# tushib qolishi mumkin.
#
# proxy_pass oxirida SLASH BOR -> `/nsfw/` prefiksi olib tashlanadi
# (/nsfw/v1/health -> 127.0.0.1:8720/v1/health). Backend `--root-path /nsfw`
# bilan ishga tushadi, shuning uchun /docs va openapi.json to'g'ri
# manzillarni ko'rsatadi.

location = /nsfw { return 301 /nsfw/; }

location ^~ /nsfw/ {
    proxy_pass http://127.0.0.1:8720/;
    include proxy_api_params.conf;

    # Rasm yuklash uchun global limitdan kattaroq (servis o'zi ham 20 MB da
    # 413 qaytaradi; nginx darajasidagi cheklov backendni ortiqcha yukdan
    # oldinroq himoya qiladi).
    client_max_body_size 20m;

    # Timeoutlar proxy_api_params.conf dan keladi (120s). Ularni bu yerda
    # QAYTA yozib bo'lmaydi: include allaqachon shu location kontekstiga
    # qo'ygani uchun nginx "directive is duplicate" xatosini beradi.
}
